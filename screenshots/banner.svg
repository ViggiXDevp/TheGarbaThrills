<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c1533"/>
      <stop offset="55%" stop-color="#8f0f3d"/>
      <stop offset="100%" stop-color="#b8134f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#f0c869" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f0c869" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bgGrad)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <!-- Decorative mandala motifs, subtle, corners -->
  <g opacity="0.14" stroke="#f0c869" stroke-width="1.5" fill="none">
    <circle cx="90" cy="60" r="40"/>
    <circle cx="90" cy="60" r="26"/>
    <circle cx="90" cy="60" r="12"/>
    <g transform="translate(90,60)">
      <line x1="-40" y1="0" x2="40" y2="0"/>
      <line x1="0" y1="-40" x2="0" y2="40"/>
      <line x1="-28" y1="-28" x2="28" y2="28"/>
      <line x1="-28" y1="28" x2="28" y2="-28"/>
    </g>
  </g>

  <g opacity="0.14" stroke="#f0c869" stroke-width="1.5" fill="none">
    <circle cx="1110" cy="220" r="40"/>
    <circle cx="1110" cy="220" r="26"/>
    <circle cx="1110" cy="220" r="12"/>
    <g transform="translate(1110,220)">
      <line x1="-40" y1="0" x2="40" y2="0"/>
      <line x1="0" y1="-40" x2="0" y2="40"/>
      <line x1="-28" y1="-28" x2="28" y2="28"/>
      <line x1="-28" y1="28" x2="28" y2="-28"/>
    </g>
  </g>

  <!-- Diya flame accents -->
  <g transform="translate(150,215)" opacity="0.9">
    <path d="M0 0 C -14 -10, -14 -26, 0 -34 C 14 -26, 14 -10, 0 0 Z" fill="#d4a017"/>
    <path d="M0 -4 C -7 -10, -7 -20, 0 -26 C 7 -20, 7 -10, 0 -4 Z" fill="#f0c869"/>
    <ellipse cx="0" cy="4" rx="20" ry="6" fill="#8f0f3d"/>
  </g>

  <g transform="translate(1050,60) scale(0.8)" opacity="0.85">
    <path d="M0 0 C -14 -10, -14 -26, 0 -34 C 14 -26, 14 -10, 0 0 Z" fill="#d4a017"/>
    <path d="M0 -4 C -7 -10, -7 -20, 0 -26 C 7 -20, 7 -10, 0 -4 Z" fill="#f0c869"/>
    <ellipse cx="0" cy="4" rx="20" ry="6" fill="#8f0f3d"/>
  </g>

  <!-- Thin gold divider line -->
  <line x1="300" y1="200" x2="900" y2="200" stroke="#d4a017" stroke-width="1" opacity="0.5"/>

  <!-- Title -->
  <text x="600" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#fffaf3" letter-spacing="1">
